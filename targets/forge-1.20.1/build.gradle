// ItemShowcase —— Forge 1.20.1 构建目标
// ForgeGradle 6 与其他加载器（NeoGradle / Loom）的配置完全隔离在各自目录中。
plugins {
    id 'net.minecraftforge.gradle' version '[6.0.30,6.2)'
    // MixinGradle：生成 refmap（生产环境 SRG 映射必需）
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "itemshowcase-forge-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 17
}

minecraft {
    // 官方映射（Mojang official mappings），1.20.1 线程安全反编译
    mappings channel: 'official', version: "${minecraft_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
            args '--nogui'
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {
        name = "CurseMaven"
        url = uri("https://www.cursemaven.com/")
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // common-core 通过 settings.gradle 的 Composite Build 以源码参与构建
    implementation 'com.heihun.Itemshowcase:itemshowcase-common-core:1.0.0'

    // ---- 可选集成（运行时检测，缺失时安全降级） ----
    // Curios API：仅编译 API 工件，运行时由玩家环境提供
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // Sophisticated Backpacks + Core：仅编译，不打包进产物
    compileOnly fg.deobf("curse.maven:sophisticated-backpacks-${sb_cf_project}:${sb_cf_file}")
    compileOnly fg.deobf("curse.maven:sophisticated-core-${sc_cf_project}:${sc_cf_file}")
    runtimeOnly fg.deobf("curse.maven:sophisticated-backpacks-${sb_cf_project}:${sb_cf_file}")
    runtimeOnly fg.deobf("curse.maven:sophisticated-core-${sc_cf_project}:${sc_cf_file}")

    // Mixin 注解处理器（生成 refmap）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 打包时把 common-core 的类合并进 mod jar（mod 使用方只需要一个 jar）
jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : "ItemShowcase",
                'Implementation-Version': mod_version,
                'MixinConfigs'          : 'itemshowcase.mixins.json'
        ])
    }
}

// Mixin 配置：refmap 生成到本 sourceSet
mixin {
    add sourceSets.main, 'itemshowcase-forge-1.20.1.refmap.json'
    config 'itemshowcase.mixins.json'
}

// 将 common-core jar 内容合并进最终 mod jar
tasks.named('jar', Jar).configure {
    from {
        configurations.runtimeClasspath
            .filter { it.name.startsWith('itemshowcase-common-core') }
            .collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
